apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fever-detection-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fever-detection-service
                port:
                  number: 8082			  
				